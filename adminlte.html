<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .container{
            display: grid;
            grid-template-columns: 250px 1250px;
            grid-template-rows: 70px 1000px;
        }
        .header{
            background-color: #212529;
            grid-column: 2/3;
            grid-row: 1/2;
            border-bottom: white solid 2px;
        }
        .sidebar{
            background-color: rgb(52, 58, 64);
            grid-column: 1/2;
            grid-row: 1/2;
            position: sticky;
            top: 2px;
            border-bottom: white solid 2px;
        }
        .sidebar2{
            background-color: rgb(52, 58, 64);
            grid-column: 1/2;
            grid-row: 2/3;
            display: flex;
            flex-direction: column;

        }
        .main{
            background-color: #2b3035;
            grid-column: 2/3;
            grid-row: 2/3;
        }
        h3{
            background-color: #494e53;
            text-align: center;
        }
        .navbar{
            background-color:#2c3136;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 25px;
        }

        .nav-left{
            display:flex;
            gap:25px;
        }

        .nav-right{
            display:flex;
            gap:20px;
        }
        .name{
            font-size: 35px;
            color: white;
        }
        .status{
            display: flex;
            justify-content: space-evenly;
            height: 200px;
            width:1200px;
        }
        .bluebox{
            height: 100px;
            width: 200px;
            background-color: #0d6efd;
            border-radius: 20px;
        }
        .greenbox{
            height: 100px;
            width: 200px;
            background-color: #198754;
            border-radius: 20px;
        }
        .yellowbox{
            height: 100px;
            width: 200px;
            background-color: #ffc107;
            border-radius: 20px;
        }
        .redbox{
            height: 100px;
            width: 200px;
            background-color: #dc3545;
            border-radius: 20px;
        }
        .charts{
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 500px;
            gap: 10px;
        }
        .graph{
            background-color: #dc3545;
            grid-column: 1/2;
            background-image: url(charts.png);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        .map{
            background-color: #fff;
            grid-column: 2/3;
            background-image: url(maps.png);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="navbar">
                <div class="nav-left">
                    <p>☰</p>
                    <p>Live Preview</p>
                    <p>Documentation</p>
                </div>

                <div class="nav-right">
                    <p>🔍</p>
                    <p>🔔</p>
                    <p>👤</p>
                </div>
            </div>
        </div>
        <div class="sidebar">
            <h1 style="color: white;">AdminLte</h1>
        </div>
        <div class="sidebar2">
            <h3 style="color: white;">Dashboard</h3>
            <h3 style="color: white;">Theme generate</h3>
            <h3 style="color: white;">widgets</h3>
            <h3 style="color: white;">Layout options</h3>
            <h3 style="color: white;">UI Elements</h3>
            <h3 style="color: white;">Mailbox</h3>
            <h3 style="color: white;">Forms</h3>
            <h3 style="color: white;">Tables</h3>
            <p style="background-color: white;">PAGES</p>
            <h3 style="color: white;">Pages</h3>
            <p style="background-color: white;">Examples</p>
        </div>
        <div class="main">
            <div class="name">
                Dashboard
            </div>

            <div class="status">
                <div class="bluebox">
                    <h1 style="color: white;">150</h1>
                </div>
                <div class="greenbox">                    
                    <h1 style="color: white;">53%</h1>
                </div>
                <div class="yellowbox">
                    <h1 style="color: black;">44</h1>
                </div>
                <div class="redbox">
                    <h1 style="color: white;">65</h1>
                </div>
            </div>
            <div class="charts">
                <div class="graph">
                </div>
                <div class="map">
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
