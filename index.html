<!DOCTYPE html>
<html>
<head>
    <title>YouTube</title>
    <link rel="shortcut icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQkH7qLcEO86yLMRbgrglI6W-FUA7qHYJXYvw&s" type="image/x-icon">
    <style>
        nav {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            border: 5px solid black;
            border-radius: 20px;
            top:3px;
        }
        .search{
            display: flex;
        }
        .search input {
            padding: 5px;
            width: 400px;
            border-radius: 30px;
            background-color: white;
            color: black;
            text-align: center;
            font-weight: bold;
        }
        .Logo{
            height: 40px;
            width: 40px;
            border: 2px solid black;
            border-radius: 50%;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSR-QHQCDJncFMrKiHDOM_N7dUhwrGGqevt8A&s);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .items{
            display: flex;
            gap: 30px;
            list-style: none;
            text-decoration: none;
        }
        a{
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        .logophoto{
            height: 40px;
            width: 40px;
            border: 2px solid black;
            border-radius: 50%;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQkH7qLcEO86yLMRbgrglI6W-FUA7qHYJXYvw&s<);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .MainVid{
            margin-top: 10px;
            height: 900px;
            width: 100%;
            background-color: grey;
            border: 2px solid black;
            border-radius: 20px;
            display: flex;
            justify-content: space-evenly;
            flex-wrap: wrap;
            padding-top: 50px;
        }
        .childVid{
            height: 200px;
            width: 300px;
            background-color: black;
            border: white 5px solid;
            border-radius: 20px;
        }
        
    </style>
</head>
<body>

    <nav>
        <div>
            <div class="logophoto"></div>
        </div>
        <ul class="items">
            <li class="element"><a href="https://www.youtube.com/" target="_blank">Home</a></li>
            <li class="element"><a href="https://www.youtube.com/" target="_blank">Contact</a></li>
            <li class="element"><a href="https://www.youtube.com/" target="_blank">about</a></li>
            <li class="element"><a href="https://www.youtube.com/" target="_blank">trending</a></li>
        </ul>

        <div class="search">
                <input type="text" placeholder="Search">
                <div class="Logo"></div>
        </div>
    </nav>

    <div class="MainVid">
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
        <div class="childVid"></div>
    </div>
    
        
</body>
</html>
