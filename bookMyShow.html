<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bookmyshow</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            border-bottom: 2px solid lightgray;
            background-color: white;
        }
        .left{
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo{
            color: red;
            font-size: 30px;
            font-weight: bold;
        }
        .search input{
            width: 400px;
            padding: 8px;
            border: 1px solid grey;
            border-radius: 5px;
        }
        .right{
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .signin{
            background-color: crimson;
            color: white;
            border: none;
            padding: 7px 15px;
            border-radius: 5px;
        }
        .menu{
            display: flex;
            justify-content: space-between;
            padding: 12px 25px;
            background-color: #f5f5f5;
        }
        .menu ul{
            display: flex;
            list-style: none;
            gap: 20px;
        }
        .menu a{
            text-decoration: none;
            color: black;
        }
        .MainVid{
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-evenly;
        }
        .childVid{
            height: 320px;
            width: 220px;
            border: 1px solid lightgray;
            border-radius: 10px;
            overflow: hidden;
            background-color: white;
        }
        .poster{
            height: 250px;
            width: 100%;
            background-size: cover;
            background-position: center;
        }
        .movieName{
            font-weight: bold;
            padding: 8px;
        }
        .poster{
            background-image: url(https://assets-in-gm.bmscdn.com/promotions/cms/creatives/1780057841447_chainsmokersweb.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
    <nav>
        <div class="left">
            <div class="logo">
                bookmyshow
            </div>
            <div class="search">
                <input type="text"
                placeholder="Search for Movies, Events, Plays, Sports and Activities">
            </div>
        </div>
        <div class="right">
            <p>Vadodara</p>
            <button class="signin">Sign In</button>
        </div>
    </nav>
    <div class="menu">
        <ul>
            <li><a href="">Movies</a></li>
            <li><a href="">Stream</a></li>
            <li><a href="">Events</a></li>
            <li><a href="">Plays</a></li>
            <li><a href="">Sports</a></li>
        </ul>
        <ul>
            <li><a href="">Offers</a></li>
            <li><a href="">Gift Cards</a></li>
        </ul>
    </div>
    <div class="poster">
    </div>
    <div class="MainVid">
        <div class="childVid">
            <div class="poster"
            style="background-image:url('https://assets-in.bmscdn.com/iedb/movies/images/mobile/thumbnail/xlarge/chand-mera-dil-et00484700-1778492742.jpg')">
            </div>
            <div class="movieName">Chand Mera dil</div>
        </div>
        <div class="childVid">
            <div class="poster"
            style="background-image:url('https://assets-in.bmscdn.com/discovery-catalog/events/tr:w-400,h-600,bg-CCCCCC,e-usm-2-2-0.5-0.008:w-400.0,h-660.0,cm-pad_resize,bg-000000,fo-top:l-image,i-discovery-catalog@@icons@@star-icon-202203010609.png,lx-24,ly-615,w-29,l-end:l-text,ie-OC40LzEwICAxOC42SysgVm90ZXM%3D,fs-29,co-FFFFFF,ly-612,lx-70,pa-8_0_0_0,l-end/et00485890-rrwgnrapqk-portrait.jpg')">
            </div>
            <div class="movieName">Pati patni aur vo do</div>
        </div>
        <div class="childVid">
            <div class="poster"
            style="background-image:url('https://assets-in.bmscdn.com/discovery-catalog/events/tr:w-400,h-600,bg-CCCCCC,e-usm-2-2-0.5-0.008:w-400.0,h-660.0,cm-pad_resize,bg-000000,fo-top:l-image,i-discovery-catalog@@icons@@star-icon-202203010609.png,lx-24,ly-615,w-29,l-end:l-text,ie-OS40LzEwICA2MzdLKyBWb3Rlcw%3D%3D,fs-29,co-FFFFFF,ly-612,lx-70,pa-8_0_0_0,l-end/et00478890-gseacbrsej-portrait.jpg')">
            </div>
            <div class="movieName">Dhurandar the Revenge</div>
        </div>
    </div>
</body>
</html>
