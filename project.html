<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .main{
            height: 600px;
            width: 400px;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            background: beige;
        }
        .topbox{
            display: flex;
            height: 150px;
            border-top-right-radius: 20px;
            border-top-left-radius: 20px;
            background-color: blueviolet;
            justify-content: center;
        }
        .photo{
            height: 150px;
            width: 150px;
            background-image: url(professional\ pic.png);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            border-radius: 50%;
            margin-top: 30px;
            border: 5px blueviolet solid;
        }
        .heading{
            display: flex;
            margin-top: 25px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .heading h2{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .socials{
            margin-top: 20px;
            align-self: center;
            display: flex;
            height: 50px;
            width: 250px;
            justify-content: space-evenly;
        }
        .socialImg1{
            height: 40px;
            width: 40px;
            background-color: black;
            border-radius: 50%;
        }
        .socialImg2{
            height: 40px;
            width: 40px;
            background-color: black;
            border-radius: 50%;
        }
        .socialImg3{
            height: 40px;
            width: 40px;
            background-color: black;
            border-radius: 50%;
        }
        .socialImg4{
            height: 40px;
            width: 40px;
            background-color: black;
            border-radius: 50%;
        }
        .subscribe{
            margin-top: 30px;
            align-self: center;
            display: flex;
            height: 50px;
            width: 300px;
        }
        .text{
            display: flex;
            align-items: center;
            height: 50px;
            width: 150px;
            justify-content: space-evenly;
            background-color: blueviolet;
            border: 2px blueviolet solid;
            margin: 20px;
            color: white;
            border-radius: 50px;
            justify-content: center;
        }
        .end{
            margin-top: 30px;
            display: flex;
            justify-content: space-around;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="topbox">
            <div class="photo"></div>
        </div>
        <div class="heading">
            <h2>CodingLab</h2>
            <p style="font-size: 20px;">Youtuber & Blogger</p>
        </div>
        <div class="socials">
            <div class="socialImg1"></div>
            <div class="socialImg2"></div>
            <div class="socialImg3"></div>
            <div class="socialImg4"></div>
        </div>

        <div class="subscribe">
            <div class="text">Subscribe</div>
            <div class="text">Message</div>
        </div>

        <div class="end">
            <h2>60.4k</h2>
            <h2>|</h2>
            <h2>60.4k</h2>
            <h2>|</h2>
            <h2>60.4k</h2>
        </div>
    </div>
</body>
</html>
