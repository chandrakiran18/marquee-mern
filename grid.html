<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(3,200px);
            grid-template-rows: repeat(3,200px);
            gap: 10px;
        }
        
        .item1{
            display: flex;
            background-color: rgb(0,0,80);
            align-items: center;
            color: white;
            text-align: center;
            border: 2px solid black;
            border-radius: 10px;
            grid-column: 1/2;
            grid-row: 1/2;
        }
        .item2{
            display: flex;
            background-color: rgb(0,0,80);
            color: white;
            border: 2px solid black;
            border-radius: 10px;
            align-items: center;
            justify-content: center;
            grid-column: 2/3;
            grid-row: 1/2;
        }
        .item3{
            display: flex;
            flex-direction: column;
            background-color: rgb(0,0,80);
            font-size: 10px;
            justify-content: space-between;
            color: white;
            border: 2px solid black;
            border-radius: 10px;
            grid-column: 1/2;
            grid-row: 2/3;
        }
        .item4{
            background-color: skyblue;
            font-size: 50px;
            font-weight: bolder;
            color: white;
            line-height: 100px;
            border: 2px solid black;
            border-radius: 10px;
            grid-column: 2/3;
            grid-row: 2/3;
        }
        .item5{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(0,0,80);
            color: white;
            border: 2px solid black;
            border-radius: 10px;
            grid-column: 3/4;
            grid-row: 1/2;
        }
        .item6{
            background-color: rgb(0,0,80);
            font-size: 10px;
            color: white;
            border: 2px solid black;
            border-radius: 10px;
            grid-column: 1/3;
            grid-row: 3/4;
        }
        .item7{
            display: flex;
            background-color: beige;
            flex-direction: column;
            border: 2px solid black;
            border-radius: 10px;
            grid-column: 3/4;
            grid-row: 2/4;
            justify-content: space-between;
        }
        .smallBox{
            height: 30px;
            width: 50px;
            background-color: grey;
            margin: 5px;
            border-radius: 5px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item1">
            <div class="smallBox"></div>
            <div class="smallBox"></div>
            <div class="smallBox"></div>
            <div class="smallBox"></div>
            <div class="smallBox"></div>
        </div>
        <div class="item2">
            <h1 style="font-size: 50px;">25K</h1>
        </div>
        <div class="item3">
            <P>Active Users</P>
            <h1 style="font-size: 70px;">1538</h1>
        </div>
        <div class="item4">DESIGN</div>
        <div class="item5">
            <h1 style="font-size: 50px;">50K</h1>
        </div>
        <div class="item6"><h1>A place to learn UI Design & web Design</h1></div>
        <div class="item7">
            <p>Total subscribers</p>
            <h1 style="font-size: 80px;">200K</h1>
        </div>
    </div>
</body>
</html>
